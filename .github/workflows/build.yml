name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Vosk wake-word model (no key needed)
        run: |
          mkdir -p app/src/main/assets
          cd "$RUNNER_TEMP"
          rm -rf vm m.zip
          mkdir vm
          (curl -fL --retry 3 -o m.zip https://alphacephei.com/vosk/models/vosk-model-small-en-in-0.4.zip \
            || curl -fL --retry 3 -o m.zip https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip) \
            && unzip -q m.zip -d vm \
            && d=$(find vm -mindepth 1 -maxdepth 1 -type d | head -1) \
            && rm -rf "$GITHUB_WORKSPACE/app/src/main/assets/vosk-model" \
            && mv "$d" "$GITHUB_WORKSPACE/app/src/main/assets/vosk-model" \
            || echo "WARNING: Vosk model download failed - app will use the old listening method"
          ls "$GITHUB_WORKSPACE/app/src/main/assets/vosk-model" || true
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: 8.7 }
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ruhi-apk
          path: app/build/outputs/apk/debug/*.apk
